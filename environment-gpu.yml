# sdmbench -- complete GPU environment (CUDA).
#
#   bash scripts/create_env.sh --gpu
#
# or by hand:
#
#   micromamba env create -f environment-gpu.yml -y
#   micromamba activate sdmbench-gpu
#   pip install -e .
#   Rscript scripts/setup_r_packages.R
#
# Identical to environment.yml except that `cpuonly` is replaced by
# `pytorch-gpu`, which pulls the CUDA build of PyTorch from conda-forge along
# with a matching CUDA runtime. No manual CUDA version pinning: conda-forge
# resolves it against the driver metapackage, which is what makes this less
# fragile than the pip route.
#
# Check afterwards:
#
#   python -c "import torch; print(torch.cuda.is_available(), torch.version.cuda)"
#   sdmbench env check
#
# If it reports False, the usual cause is a driver older than the CUDA runtime
# conda selected. `nvidia-smi` shows the maximum CUDA the driver supports; pin
# `cuda-version=<that>` below to constrain the solve.
#
# Who actually needs this: TabPFN inference (roughly 50x faster on GPU) and the
# graph/neural models. The published R baselines are CPU-only, so a reproduction
# of MaxNet/BRT/GAM/RF needs nothing here.

name: sdmbench-gpu

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip

  # --- core ----------------------------------------------------------------
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - pyarrow>=12.0
  - pyyaml>=6.0

  # --- gradient boosting ---------------------------------------------------
  - xgboost>=2.0
  - lightgbm>=4.0
  - catboost>=1.2

  # --- deep learning and graph models (CUDA) -------------------------------
  - pytorch>=2.0
  - pytorch-gpu                  # the CUDA build; replaces `cpuonly`
  - torchvision
  - torch-geometric>=2.4
  # Uncomment and set to the driver's maximum if the solve picks a CUDA runtime
  # newer than your driver supports (see `nvidia-smi`):
  # - cuda-version=12.1

  # --- geospatial ----------------------------------------------------------
  - gdal
  - rasterio>=1.3
  - rioxarray>=0.15
  - xarray>=2023.1
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.5

  # --- explainability, plots, lightweight AutoML ---------------------------
  - shap>=0.44
  - matplotlib>=3.7
  - flaml>=2.1

  # --- R: the PUBLISHED baselines ------------------------------------------
  - r-base>=4.3
  - r-jsonlite
  - r-maxnet
  - r-dismo
  - r-gbm
  - r-randomforest
  - r-mgcv

  # --- R: spatial and metric parity ----------------------------------------
  - r-sf
  - r-terra
  - r-yardstick
  - r-tidysdm
  - r-rsample
  - r-spatialsample

  # --- development ---------------------------------------------------------
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4

  # --- pip-only ------------------------------------------------------------
  - pip:
      - tabpfn>=2.0,<3           # see environment.yml for why <3
      - huggingface-hub>=0.20
      - -e .
